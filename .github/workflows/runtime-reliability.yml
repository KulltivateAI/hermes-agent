name: Runtime reliability

on:
  pull_request:
    branches: [review-base/runtime-reliability-869228c]

permissions:
  contents: read

jobs:
  runtime-reliability-acceptance:
    name: runtime-reliability-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.9.28"
      - name: Locked isolated dependencies
        run: uv sync --locked --python 3.11 --extra dev --extra messaging
      - name: Exact source and interpreter
        run: |
          git rev-parse HEAD
          .venv/bin/python -c 'import sys, sqlite3, pytest, hermes_cli.goals as g; print(sys.executable, sqlite3.sqlite_version, pytest.__version__, g.__file__)'
      - name: Combined state, gateway, configuration and preservation acceptance
        run: |
          set -euo pipefail
          tests=(
            tests/tools/test_snapshot_invocation_authority.py
            tests/tools/test_snapshot_session_id_leak.py
            tests/tools/test_snapshot_multiline_session_env_injection.py
            tests/test_state_meta_cas.py
            tests/hermes_cli/test_goal_gates.py
            tests/hermes_cli/test_goal_generation_fencing.py
            tests/hermes_cli/test_goal_wait_eligibility.py
            tests/scripts/test_contributor_workflow_range.py
            tests/hermes_cli/test_goal_delivery_ownership.py
            tests/hermes_cli/test_goals.py
            tests/hermes_cli/test_goals_db_bootstrap_off_loop.py
            tests/hermes_cli/test_goal_judge_timeout_config.py
            tests/hermes_cli/test_goal_judge_delegations.py
            tests/hermes_cli/test_goal_dispatch.py
            tests/hermes_cli/test_kanban_goal_mode.py
            tests/gateway/test_goal_gate_access.py
            tests/gateway/test_session_env.py
            tests/cli/test_cli_goal_interrupt.py
            tests/cli/test_cli_goal_parked_resume.py
            tests/tui_gateway/test_goal_command.py
            tests/tui_gateway/test_session_control.py
            tests/agent/test_compression_rotation_state.py
            tests/gateway/test_goal_event_fencing.py
            tests/gateway/test_goal_adapter_fencing.py
            tests/gateway/test_runtime_repair_effective_config.py
            tests/gateway/test_goal_continuation_drain.py
            tests/gateway/test_goal_resume_restart.py
            tests/gateway/test_goal_status_notice.py
            tests/gateway/test_goal_verdict_send.py
            tests/gateway/test_loop_command.py
            tests/gateway/test_shutdown_flush.py
            tests/gateway/test_pending_drain_race.py
            tests/gateway/test_pending_queue_spool.py
            tests/gateway/test_queue_consumption.py
            tests/gateway/test_queued_native_image_session_key.py
            tests/gateway/test_restart_resume_pending.py
            tests/gateway/test_busy_steer_origin.py
            tests/gateway/test_compression_session_id_persistence.py
            tests/run_agent/test_tool_call_guardrail_runtime.py
            tests/agent/test_tool_guardrails.py
            tests/run_agent/test_background_review.py
            tests/run_agent/test_background_review_cache_parity.py
            tests/test_background_review_session_isolation.py
          )
          for test_file in "${tests[@]}"; do
            test -f "$test_file" || { printf 'Missing acceptance file: %s\n' "$test_file"; exit 1; }
          done
          bash scripts/run_tests.sh -j 4 "${tests[@]}"
